<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>速算华容道 · 闪记测试</title>
<link rel="stylesheet" href="arena.css">
<script src="puzzle.js" defer></script>
<script src="game.js" defer></script>
</head>
<body>
<main class="lab">
  <h1>速算华容道</h1>
  <section class="test-area" aria-label="题目闪示">
    <div class="screen" id="screen" aria-label="题目显示窗口">
      <p class="screen-label" id="screen-label">等待开始</p>
      <p class="flash-order" id="flash-order" hidden></p>
      <div id="screen-cross" class="cross" hidden></div>
    </div>
    <form class="settings" id="settings">
      <div class="board-settings">
        <label for="board-size">棋盘</label>
        <select id="board-size">
          <option value="4">4×4</option>
          <option value="5">5×5</option>
        </select>
      </div>
      <div class="board-settings">
        <label for="question-count">题目数</label>
        <select id="question-count">
          <option value="1">1 题</option>
          <option value="2">2 题</option>
          <option value="3">3 题</option>
          <option value="4">4 题</option>
          <option value="5">5 题</option>
          <option value="6">6 题</option>
          <option value="7">7 题</option>
          <option value="8">8 题</option>
          <option value="9">9 题</option>
          <option value="10">10 题</option>
        </select>
      </div>
      <div class="timing-fields">
        <div class="timing-field">
          <label for="duration">闪示时长</label>
          <div class="duration">
            <input id="duration" type="number" min="0.01" step="0.01" value="1" inputmode="decimal" required>
            <span>秒</span>
          </div>
        </div>
        <div class="timing-field">
          <label for="question-gap">题目间隔</label>
          <div class="duration">
            <input id="question-gap" type="number" min="0" step="0.01" value="0" inputmode="decimal" required>
            <span>秒</span>
          </div>
        </div>
      </div>
      <div class="test-buttons">
        <button class="start" id="start" type="submit" title="生成新一轮题目并开始测试">开始测试</button>
        <button class="secondary" id="replay" type="button" disabled>再看一遍</button>
      </div>
      <div class="time-readout">
        <span>用时</span>
        <time id="elapsed" datetime="PT0S">0.00</time>
        <span>秒</span>
      </div>
      <p class="status" id="status" role="status">闪示结束后开始推盘。</p>
    </form>
  </section>
  <section class="play" aria-label="数字华容道">
    <nav class="question-tabs" id="question-tabs" aria-label="选择答题棋盘" hidden></nav>
    <div id="board" class="board" role="group" aria-label="4×4 推盘"></div>
    <div class="board-actions">
      <p class="board-note" id="board-note">点击同行或同列的数字，整段滑动。</p>
      <div class="review-totals" id="review-totals" aria-live="polite" hidden>
        <div><span>当前和</span><strong id="review-sum"></strong></div>
        <div><span>目标</span><strong id="review-target"></strong></div>
        <div><span>相差</span><strong id="review-difference"></strong></div>
        <p id="review-empty" hidden>十字架内有空格</p>
      </div>
      <div class="answer-buttons">
        <button class="secondary" id="review" type="button" aria-controls="screen" aria-expanded="false" disabled>查看题目</button>
        <button class="start" id="verify" type="button" hidden>提交验证</button>
      </div>
    </div>
    <p class="verification-result" id="verification-result" role="status" hidden></p>
  </section>
</main>
</body>
</html>
